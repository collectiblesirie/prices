:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#000000; --ink-2:#5E5E5E; --line:#E2E2E2;
  --cobalt:#000000; --sticker:#000000; --sticker-ink:#FFFFFF; --sold:#000000;
  --ph-a:#F4F4F4; --ph-b:#EDEDED; --shadow:none;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-family:var(--display);font-weight:800;font-size:clamp(22px,4.4vw,30px);letter-spacing:-.02em;line-height:1}
.brand b i{font-style:normal;color:var(--cobalt)}
.brand span{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);margin-top:5px}
.search{flex:1 1 240px;max-width:360px;position:relative}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:0 16px 0 38px}
.search svg{position:absolute;left:13px;top:12px;width:16px;height:16px;stroke:var(--ink-2)}
.tools{display:flex;gap:8px;align-items:center;padding-bottom:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip-btn small{font-family:var(--mono);color:var(--ink-2);margin-left:4px;font-size:11px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip-btn[aria-pressed="true"] small{color:inherit;opacity:.7}
.opts{display:flex;gap:8px;align-items:center;flex:none}
select.sel{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 8px;font-size:13px}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tog input{accent-color:var(--cobalt)}
main{padding-block:18px 40px}
.count{font-size:12px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:var(--card);border-radius:6px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;cursor:pointer;position:relative}
.card:focus-visible{outline:2px solid var(--cobalt)}
.card:hover .ph img{transform:scale(1.03)}
.ph{aspect-ratio:4/5;max-width:100%;background:repeating-linear-gradient(135deg,var(--ph-a) 0 12px,var(--ph-b) 12px 24px);display:grid;place-items:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff;transition:transform .3s}
.ph .glyph{font-family:var(--display);font-weight:800;font-size:40px;color:var(--ink-2);opacity:.45;letter-spacing:-.03em}
.ph .cat{position:absolute;left:8px;bottom:8px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;background:var(--card);color:var(--ink-2);padding:3px 7px;border-radius:4px}
.tag{position:absolute;top:8px;right:8px;background:var(--sticker);color:var(--sticker-ink);font-family:var(--mono);font-weight:700;font-size:15px;padding:4px 9px;border-radius:2px;font-variant-numeric:tabular-nums}
.tag s{font-weight:500;opacity:.6;font-size:11px;margin-right:4px}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.lot{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.name{font-weight:600;font-size:14px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.state{font-family:var(--body);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:1px 6px;border-radius:3px}
.state.sold{color:var(--sold);border:1px solid var(--sold)}
.state.hidden{color:var(--ink-2);border:1px dashed var(--ink-2)}
.card.is-sold .ph{filter:grayscale(.85);opacity:.7}
.card.is-sold .tag{background:var(--card);color:var(--ink-2);text-decoration:line-through}
.card.is-hidden{opacity:.55}
.empty{padding:48px 16px;text-align:center;color:var(--ink-2)}
footer{border-top:1px solid var(--line);padding-block:18px 28px;font-size:13px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
footer a{color:var(--cobalt)}
.linkbtn{all:unset;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
/* manage */
.mbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-bottom:14px;border-radius:10px;background:var(--card);border:1px dashed var(--cobalt)}
.mbar p{margin:0 auto 0 0;font-size:13px;color:var(--ink-2)}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:#000;color:#fff;border-color:#000}
.brand b{text-transform:uppercase;letter-spacing:.01em}
.card.is-sold .tag{border:1px solid var(--line)}
.pub .btn{background:#fff;color:#000;border-color:#fff}
.pub .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn.warn{color:var(--sold);border-color:var(--sold)}
.btn:disabled{opacity:.5;cursor:default}
.pub{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);color:var(--paper);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.pub .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-inline:0}
.pub p{margin:0 auto 0 0;font-size:14px}
/* overlay */
.ov{position:fixed;inset:0;z-index:10;background:rgba(8,11,30,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:16px;padding:22px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);flex:none}
.detail{display:grid;gap:18px}
@media (min-width:700px){.detail{grid-template-columns:1fr 1fr}}
.detail .ph{border-radius:10px}
.big-price{font-family:var(--mono);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big-price s{font-size:16px;color:var(--ink-2);font-weight:500;margin-left:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.kv dd{margin:0}
.note{white-space:pre-wrap;color:var(--ink-2);font-size:14px}
form.ed{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 10px;width:100%;font:inherit;color:inherit}
.f textarea{min-height:64px;resize:vertical}
.photo{display:flex;gap:12px;align-items:center}
.photo .ph{width:84px;flex:none;border-radius:8px}
.photo .ph .glyph{font-size:22px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.acts .left{margin-right:auto}
.msg{font-size:13px;color:var(--sold);margin:0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

}

    pb.innerHTML='<div class="pub"><div class="wrap"><p>'+S.dirty+' unpublished '+(S.dirty===1?'change':'changes')+'. Visitors see the old list until you publish.</p><button class="btn ghost" id="discard">Discard</button><button class="btn" id="publish">Publish</button></div></div>';
    document.getElementById('publish').addEventListener('click',publish);
    document.getElementById('discard').addEventListener('click',function(){try{sessionStorage.removeItem(STASH)}catch(e){}S.products=DATA.products.map(function(p){return Object.assign({},p)});S.cats=DATA.categories.slice();S.dirty=0;renderAll();toast('Changes discarded')});
    document.querySelector('main').style.paddingBottom='96px';
  }else{pb.innerHTML='';document.querySelector('main').style.paddingBottom='';}
}
function renderAll(){renderChips();renderGrid();renderManage()}
function closeOv(){document.getElementById('ov').innerHTML='';document.removeEventListener('keydown',escKey)}
function escKey(e){if(e.key==='Escape')closeOv()}
function openOv(html){
  var ov=document.getElementById('ov');ov.innerHTML='<div class="ov"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  ov.firstChild.addEventListener('click',function(e){if(e.target===ov.firstChild)closeOv()});
  ov.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',closeOv)});
  document.addEventListener('keydown',escKey);
  return ov;
}
var X='<button class="x" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2"><path d="M1 1l12 12M13 1L1 13"/></svg></button>';
function openDetail(p){
  openOv('<div class="sheet-head"><span class="lot">'+lotStr(p.lot)+'</span>'+X+'</div><div class="detail">'+phHTML(p,false)+
  '<div><h2 style="font-family:var(--display);font-size:24px;margin:0 0 10px;text-wrap:balance">'+esc(p.name)+'</h2>'+
  '<div class="big-price">'+priceLabel(p)+(p.was?'<s>'+money(p.was)+'</s>':'')+'</div>'+
  '<dl class="kv"><dt>Category</dt><dd>'+esc(p.cat)+'</dd><dt>Status</dt><dd>'+(p.status==='sold'?'Sold out':'Available at the stand')+'</dd></dl>'+
  (p.note?'<p class="note">'+esc(p.note)+'</p>':'')+
  '<p class="note">Quote <b>'+lotStr(p.lot)+'</b> at the counter.</p></div></div>');
}
var draftImg;
function openEditor(p){
  var isNew=!p;
  var d=p?Object.assign({},p):{id:'n'+Date.now().toString(36),lot:S.products.reduce(function(m,x){return Math.max(m,x.lot)},0)+1,name:'',cat:S.cat!=='all'?S.cat:S.cats[0],price:'',status:'available'};
  draftImg=d.img||'';
  var catOpts=S.cats.map(function(c){return '<option'+(c===d.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'<option value="__new">New category…</option>';
  var ov=openOv('<div class="sheet-head"><h2>'+(isNew?'Add product':'Edit '+lotStr(d.lot))+'</h2>'+X+'</div>'+
  '<form class="ed" id="ed" novalidate>'+
  '<div class="photo"><div id="pv">'+phHTML(d,false)+'</div><div class="f" style="flex:1"><label for="img">Photo</label><input type="file" id="img" accept="image/*"><button type="button" class="linkbtn" id="rmimg" style="font-size:13px;align-self:flex-start"'+(d.img?'':' hidden')+'>Remove photo</button></div></div>'+
  '<div class="f"><label for="nm">Name</label><input id="nm" value="'+esc(d.name)+'" required></div>'+
  '<div class="row2"><div class="f"><label for="pr">Price (₹)</label><input id="pr" inputmode="numeric" value="'+esc(d.price)+'"></div><div class="f"><label for="was">Was (₹, optional)</label><input id="was" inputmode="numeric" value="'+esc(d.was||'')+'"></div></div>'+
  '<div class="row2"><div class="f"><label for="ct">Category</label><select id="ct">'+catOpts+'</select><input id="ctn" placeholder="New category name" hidden></div>'+
  '<div class="f"><label for="stt">Status</label><select id="stt"><option value="available">Available</option><option value="sold">Sold out</option><option value="hidden">Hidden from visitors</option></select></div></div>'+
  '<div class="row2"><div class="f"><label for="lt">Item No.</label><input id="lt" inputmode="numeric" value="'+esc(d.lot)+'"></div><div class="f"></div></div>'+
  '<div class="f"><label for="nt">Note (optional)</label><textarea id="nt" placeholder="Grade, condition, edition, size…">'+esc(d.note||'')+'</textarea></div>'+
  '<p class="msg" id="err" hidden></p>'+
  '<div class="acts">'+(isNew?'':'<button type="button" class="btn warn left" id="del">Delete</button>')+'<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">'+(isNew?'Add':'Save')+'</button></div></form>');
  ov.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',closeOv)});
  var $=function(id){return document.getElementById(id)};
  $('stt').value=d.status;
  $('ct').addEventListener('change',function(){$('ctn').hidden=$('ct').value!=='__new';if(!$('ctn').hidden)$('ctn').focus()});
  function refreshPv(){$('pv').innerHTML=phHTML({img:draftImg,cat:$('ct').value==='__new'?$('ctn').value:$('ct').value},false);$('rmimg').hidden=!draftImg}
  $('rmimg').addEventListener('click',function(){draftImg='';refreshPv()});
  $('img').addEventListener('change',function(){var f=$('img').files[0];if(!f)return;shrink(f).then(function(u){draftImg=u;refreshPv()}).catch(function(){showErr('That file could not be read as an image. Try a JPG or PNG.')})});
  function showErr(m){$('err').textContent=m;$('err').hidden=false}
  if(!isNew)$('del').addEventListener('click',function(){
    var b=$('del');if(b.dataset.armed){S.products=S.products.filter(function(x){return x.id!==d.id});changed();closeOv();toast('Deleted '+lotStr(d.lot))}
    else{b.dataset.armed='1';b.textContent='Tap again to delete'}});
  $('ed').addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('nm').value.trim(),price=Number(String($('pr').value).replace(/[^\d.]/g,'')),was=Number(String($('was').value).replace(/[^\d.]/g,''))||0,lot=parseInt($('lt').value,10);
    var cat=$('ct').value==='__new'?$('ctn').value.trim():$('ct').value;
    if(!name)return showErr('Add a name so visitors know what this is.');
    if(!price)return showErr('Enter the price in rupees, numbers only.');
    if(!cat)return showErr('Type a name for the new category.');
    if(!lot||lot<1)return showErr('Item No. must be a whole number.');
    var clash=S.products.some(function(x){return x.lot===lot&&x.id!==d.id});
    if(clash)return showErr(lotStr(lot)+' is already used by another item.');
    if(S.cats.indexOf(cat)<0)S.cats.push(cat);
    var out={id:d.id,lot:lot,name:name,cat:cat,price:price,status:$('stt').value};
    if(was>price)out.was=was;
    var nt=$('nt').value.trim();if(nt)out.note=nt;
    if(draftImg)out.img=draftImg;
    if(isNew)S.products.push(out);else S.products=S.products.map(function(x){return x.id===d.id?out:x});
    changed();closeOv();toast(isNew?'Added '+lotStr(lot):'Saved '+lotStr(lot));
  });
  setTimeout(function(){$('nm').focus()},30);
}
function shrink(file){return new Promise(function(res,rej){
  var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
    var max=720,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',0.78));};im.src=r.result;};r.readAsDataURL(file);})}
function changed(){
  S.dirty++;
  try{sessionStorage.setItem(STASH,JSON.stringify({products:S.products,cats:S.cats,dirty:S.dirty}))}catch(e){}
  renderAll();
}
var tt;function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(function(){t.remove()},2200)}
function buildDoc(data){
  var hs=document.querySelector('head style');var reset=hs?hs.textContent:'';
  var json=JSON.stringify(data).replace(/</g,'\\u003c');
  var fonts=document.getElementById('fonts').outerHTML;
  var css=document.getElementById('css').textContent;
  var main=document.getElementById('main').textContent;
  var C='</scr'+'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    TITLE+fonts+'<style id="css">'+css+'</style><div id="app"></div><script type="application/json" id="catalog">'+json+C+'<script id="main">'+main+C+'</body></html>';
}
function publish(){
  var btn=document.getElementById('publish');btn.disabled=true;btn.textContent='Publishing…';
  var fail=function(m){btn.disabled=false;btn.textContent='Publish';toast(m)};
  var used=S.cats.filter(function(c){return S.products.some(function(p){return p.cat===c})});
  var doc=buildDoc({updatedAt:new Date().toISOString(),categories:used,products:S.products.slice().sort(function(a,b){return a.lot-b.lot})});
  if(!(window.claude&&window.claude.use))return fail('Saving only works when the page is open on claude.ai.');
  window.claude.use('artifact').then(function(a){
    if(!a)return fail('This view can’t save. Open the page from your own Claude account.');
    return a.publish(doc).then(function(){try{sessionStorage.removeItem(STASH)}catch(e){}},function(e){
      var c=e&&e.code;
      if(c==='conflict'){try{sessionStorage.removeItem(STASH)}catch(x){}return;}
      if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled')return fail('This view is read-only. Sign in as the page owner to publish.');
      if(c==='too_large')return fail('The page is too big to save. Remove a few photos or use smaller ones.');
      if(c==='rate_limited')return fail('Publishing too often. Wait a minute, then publish again.');
      fail('Publish didn’t go through. Try again in a moment.');
    });
  });
}
renderShell();renderAll();
if(S.canManage)S.manage=S.manage||location.hash==='#manage',renderAll();
if(window.claude&&window.claude.use){window.claude.use('user').then(function(u){if(!u||!u.canEdit)return;return Promise.resolve(u.canEdit()).then(function(ok){if(ok&&!S.manage)toast('You can edit this guide: tap Manage at the bottom')})}).catch(function(){})}
})();
</script>
